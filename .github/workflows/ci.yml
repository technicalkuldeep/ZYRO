name: quality
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zyro
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: zyro
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U zyro" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://zyro:ci-only@localhost:5432/zyro
      - run: npm run build
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - run: cargo +1.99.0 fmt --check --manifest-path services/zcash/Cargo.toml
      - run: cargo +1.99.0 test --locked --manifest-path services/zcash/Cargo.toml
      - run: cargo +1.99.0 fmt --check --manifest-path services/zcash/transaction-inspect/Cargo.toml
      - run: cargo +1.99.0 test --locked --manifest-path services/zcash/transaction-inspect/Cargo.toml
