services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zyro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored .env file}
      POSTGRES_DB: zyro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zyro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyro -d zyro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  zyro-postgres:
