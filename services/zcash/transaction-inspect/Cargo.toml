[package]
name = "zyro-transaction-inspect"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hex = "0.4.3"
orchard = { version = "=0.16.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_note_encryption = "=0.5.1"
pczt = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818", features = ["signer", "orchard"] }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818", default-features = false, features = ["std"] }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
